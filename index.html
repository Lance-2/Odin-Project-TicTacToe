<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="game" aria-labelledby="game-title">
    <h1 id="game-title">Tic-Tac-Toe</h1>

    <p id="game-status" class="status" aria-live="polite">Player X's turn</p>

    <div class="board" role="grid" aria-label="Tic-Tac-Toe board">
      <button class="cell" type="button" role="gridcell" aria-label="Row 1, column 1"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 1, column 2"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 1, column 3"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 2, column 1"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 2, column 2"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 2, column 3"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 3, column 1"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 3, column 2"></button>
      <button class="cell" type="button" role="gridcell" aria-label="Row 3, column 3"></button>
    </div>

    <button id="restart-button" class="restart-button" type="button">Restart game</button>
  </main>
</body>
</html>
